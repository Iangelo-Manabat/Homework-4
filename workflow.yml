jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install flake8
        run: pip install flake8
      - name: Run lint
        run: flake8 .


jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest

- name: cleanup
  taskSpec:
    steps:
      - name: cleanup
        image: alpine
        script: |
          #!/bin/sh
          echo "Cleaning workspace..."
          rm -rf /workspace/source/*

- name: nose-test
  taskSpec:
    steps:
      - name: run-nose-tests
        image: python:3.10
        script: |
          #!/bin/sh
          pip install nose
          nosetests
